<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lens/Glass shape -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#grad)" stroke-width="12"/>
  
  <!-- Glass handle -->
  <path d="M140 60 L180 40" stroke="url(#grad)" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Data bars inside lens (representing database rows) -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="80" height="4" fill="#2563EB" opacity="0.8"/>
    <rect x="0" y="20" width="80" height="4" fill="#2563EB" opacity="0.8"/>
    <rect x="0" y="40" width="80" height="4" fill="#2563EB" opacity="0.8"/>
    <rect x="0" y="60" width="80" height="4" fill="#2563EB" opacity="0.8"/>
  </g>
  
  <!-- Center dot (focus point) -->
  <circle cx="100" cy="100" r="8" fill="#2563EB"/>
  
  <!-- Text label -->
  <text x="100" y="185" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="20" font-weight="600" text-anchor="middle" fill="#0B1220">
    Db2iLens
  </text>
</svg>
