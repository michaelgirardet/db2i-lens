<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lens shape -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad)" stroke-width="6"/>
  
  <!-- Handle -->
  <path d="M70 30 L90 20" stroke="url(#grad)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Data bars -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="40" height="2" fill="#2563EB" opacity="0.8"/>
    <rect x="0" y="10" width="40" height="2" fill="#2563EB" opacity="0.8"/>
    <rect x="0" y="20" width="40" height="2" fill="#2563EB" opacity="0.8"/>
  </g>
  
  <!-- Focus point -->
  <circle cx="50" cy="50" r="4" fill="#2563EB"/>
</svg>
